```
<nav class="navbar">

    <a href="./index.html" class="logo">
        Skill<span>Up</span>
    </a>

    <div class="nav-right">
        <span>Already have an account?</span>

        <a href="./login.html" class="login-link">
            Login
        </a>
    </div>

</nav>

<main class="main">

    <div class="register-card">

        <div class="heading">

            <h1>
                Create <span>Account</span>
            </h1>

            <p>
                Start your journey with Skill Up
            </p>

        </div>

        <form id="registerForm">

            <div class="form-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="registerCollege">
                    College
                </label>

                <input
                    type="text"
                    id="registerCollege"
                    placeholder="Enter your college name"
                >

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="registerBranch">
                        Branch
                    </label>

                    <select id="registerBranch">

                        <option value="">
                            Select Branch
                        </option>

                        <option value="IT">
                            Information Technology
                        </option>

                        <option value="CSE">
                            Computer Science
                        </option>

                        <option value="ECE">
                            Electronics & Communication
                        </option>

                        <option value="ME">
                            Mechanical Engineering
                        </option>

                        <option value="CE">
                            Civil Engineering
                        </option>

                        <option value="EE">
                            Electrical Engineering
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="registerYear">
                        Year
                    </label>

                    <select id="registerYear">

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>

            </div>

            <div id="registerMessage"></div>

            <button
                type="submit"
                id="registerButton"
                class="register-button"
            >
                Create Account
            </button>

        </form>

        <div class="bottom-text">

            Already have an account?

            <a href="./login.html">
                Login here
            </a>

        </div>

    </div>

</main>

<footer>
    © 2026 Skill Up. All rights reserved.
</footer>
<script>

const API_BASE =
    "https://skill-up-portal-backend.onrender.com/api";

document
    .getElementById("registerForm")
    .addEventListener("submit", registerUser);


async function registerUser(event) {

    event.preventDefault();

    const name =
        document.getElementById("registerName").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const college =
        document.getElementById("registerCollege").value.trim();

    const branch =
        document.getElementById("registerBranch").value;

    const year =
        document.getElementById("registerYear").value;

    const button =
        document.getElementById("registerButton");


    if (!name) {
        showRegisterMessage("Please enter your full name.", false);
        return;
    }

    if (!email) {
        showRegisterMessage("Please enter your email.", false);
        return;
    }

    if (password.length < 6) {
        showRegisterMessage(
            "Password must be at least 6 characters.",
            false
        );
        return;
    }


    button.disabled = true;
    button.textContent = "Creating Account...";


    try {

        console.log(
            "REGISTER URL:",
            API_BASE + "/register"
        );


        const response = await fetch(
            API_BASE + "/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    college: college,
                    branch: branch,
                    year: year
                })
            }
        );


        console.log(
            "REGISTER STATUS:",
            response.status
        );


        const text = await response.text();

        console.log(
            "RAW SERVER RESPONSE:",
            text
        );


        let data = null;

        try {
            data = JSON.parse(text);
        } catch (e) {
            console.log("Response was not JSON.");
        }


        // ==========================================
        // SERVER ERROR
        // ==========================================

        if (!response.ok) {

            showRegisterMessage(
                data?.message ||
                `Registration failed (${response.status})`,
                false
            );

            button.disabled = false;
            button.textContent = "Create Account";

            return;
        }


        // ==========================================
        // SUCCESS
        // ==========================================

        if (data?.token) {

            localStorage.setItem(
                "token",
                data.token
            );

        }


        if (data?.user) {

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

        }


        localStorage.setItem(
            "loggedIn",
            "true"
        );


        showRegisterMessage(
            data?.message ||
            "Account created successfully!",
            true
        );


        button.textContent =
            "Account Created ✓";


        setTimeout(() => {

            window.location.href =
                "./login.html";

        }, 1200);


    } catch (error) {

        console.error(
            "REGISTER ERROR:",
            error
        );


        showRegisterMessage(
            "Cannot connect to the backend server.",
            false
        );


        button.disabled = false;
        button.textContent = "Create Account";

    }

}


function showRegisterMessage(
    text,
    success
) {

    const message =
        document.getElementById(
            "registerMessage"
        );


    message.style.display = "block";

    message.textContent = text;


    if (success) {

        message.style.color = "#15803d";

        message.style.background = "#dcfce7";

        message.style.border =
            "1px solid #86efac";

    } else {

        message.style.color = "#b91c1c";

        message.style.background = "#fee2e2";

        message.style.border =
            "1px solid #fecaca";

    }

}

</script>


</body>

</html>
