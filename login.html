
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Skill Up</title>

    <script src="api.js"></script>
    <script src="protect.js"></script>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <style>

        /* =====================================================
           LOGIN PAGE — MOBILE RESPONSIVE FIX
        ===================================================== */

        @media (max-width: 768px) {

            body.auth-page {
                min-height: 100vh;
                padding: 20px 14px;
                overflow-x: hidden;
            }

            .auth-container {
                width: 100%;
                max-width: 480px;
                min-height: auto;
                margin: 0 auto;

                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            /* LEFT SECTION */

            .auth-left {
                width: 100%;
                padding: 25px 20px;
                text-align: center;
                border-radius: 20px;
            }

            .auth-left .brand {
                font-size: 28px;
                margin-bottom: 18px;
            }

            .auth-left h1 {
                font-size: 28px;
                line-height: 1.2;
                margin-bottom: 12px;
            }

            .auth-left p {
                font-size: 14px;
                line-height: 1.6;
                max-width: 360px;
                margin: 0 auto;
            }

            .auth-points {
                margin-top: 20px;
                text-align: left;
            }

            .auth-points div {
                font-size: 14px;
                margin-bottom: 10px;
            }


            /* LOGIN CARD */

            .auth-card {
                width: 100%;
                padding: 28px 20px;
                border-radius: 20px;
            }

            .auth-card h2 {
                font-size: 26px;
            }

            .auth-subtitle {
                font-size: 14px;
                line-height: 1.5;
            }


            /* INPUTS */

            .auth-card input {
                width: 100%;
                min-height: 48px;
                font-size: 15px;
                padding: 12px 14px;
            }


            /* BUTTON */

            .auth-card button {
                width: 100%;
                min-height: 48px;
                font-size: 15px;
            }


            /* BOTTOM */

            .auth-bottom {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 7px;
                text-align: center;
                font-size: 14px;
            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body.auth-page {
                padding: 12px 10px;
            }

            .auth-container {
                gap: 14px;
            }

            .auth-left {
                padding: 22px 16px;
                border-radius: 17px;
            }

            .auth-left .brand {
                font-size: 25px;
            }

            .auth-left h1 {
                font-size: 24px;
            }

            .auth-left p {
                font-size: 13px;
            }

            .auth-points div {
                font-size: 13px;
            }

            .auth-card {
                padding: 24px 16px;
                border-radius: 17px;
            }

            .auth-card h2 {
                font-size: 24px;
            }

            .auth-subtitle {
                font-size: 13px;
            }

            .auth-card input {
                min-height: 46px;
                font-size: 14px;
            }

            .auth-card button {
                min-height: 46px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body class="auth-page">


    <div class="auth-container">


        <!-- =================================================
             LEFT SIDE
        ================================================== -->

        <div class="auth-left">

            <div class="brand">
                SKILL<span>UP</span>
            </div>


            <h1>
                Welcome Back 👋
            </h1>


            <p>
                Continue your journey and discover
                the right career path for your skills.
            </p>


            <div class="auth-points">

                <div>
                    ✓ Personalized Career Paths
                </div>

                <div>
                    ✓ Skill Gap Analysis
                </div>

                <div>
                    ✓ Company Skill Matching
                </div>

            </div>

        </div>


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <div class="auth-card">


            <h2>
                Login
            </h2>


            <p class="auth-subtitle">
                Access your Skill Up portal
            </p>


            <form id="loginForm">


                <!-- EMAIL -->

                <label for="loginEmail">
                    Email
                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <!-- PASSWORD -->

                <label for="loginPassword">
                    Password
                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>


                <!-- MESSAGE -->

                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>


            </form>


            <!-- REGISTER -->

            <div class="auth-bottom">

                <span>
                    Don't have an account?
                </span>

                <a href="./register.html">
                    Create Account
                </a>

            </div>


        </div>


    </div>


    <!-- AUTH JS -->

    <script src="./auth.js"></script>


</body>

</html>
