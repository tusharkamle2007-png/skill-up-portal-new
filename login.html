    /* =====================================================
       SMALL MOBILE
    ===================================================== */

        body.auth-page {
            padding: 12px 10px;
        }

        .auth-container {
            gap: 14px;
        }

        .auth-left {
            padding: 22px 16px;
            border-radius: 17px;
        }

    /* =====================================================

        margin-top: 15px;
        padding: 11px 13px;

        font-size: 14px;
        line-height: 1.5;

</style>

</head>

<body class="auth-page">

```
<div class="auth-container">


    <!-- =================================================
         LEFT SIDE
    ================================================== -->

    <div class="auth-left">

        <div class="brand">
            SKILL<span>UP</span>
        </div>


        <h1>
            Welcome Back 👋
        </h1>


        <p>
            Continue your journey and discover
            the right career path for your skills.
        </p>


        <div class="auth-points">

            <div>
                ✓ Personalized Career Paths
            </div>

            <div>
                ✓ Skill Gap Analysis
            </div>

            <div>
                ✓ Company Skill Matching
            </div>

        </div>

    </div>


    <!-- =================================================
         LOGIN CARD
    ================================================== -->

    <div class="auth-card">


        <h2>
            Login
        </h2>


        <p class="auth-subtitle">
            Access your Skill Up portal
        </p>


        <form id="loginForm">


            <!-- EMAIL -->

            <label for="loginEmail">
                Email
            </label>


            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <!-- PASSWORD -->

            <label for="loginPassword">
                Password
            </label>


            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


            <!-- MESSAGE -->

            <p
                id="loginMessage"
                class="auth-message"
            ></p>


        </form>


        <!-- REGISTER -->

        <div class="auth-bottom">

            <span>
                Don't have an account?
            </span>

            <a href="./register.html">
                Create Account
            </a>

        </div>


    </div>


</div>


<!-- =====================================================
     DIRECT LIVE LOGIN JAVASCRIPT
     RENDER BACKEND
====================================================== -->

<script>

    const API_BASE =
        "https://skill-up-portal-backend.onrender.com/api";


    const loginForm =
        document.getElementById("loginForm");


    loginForm.addEventListener(
        "submit",
        loginUser
    );


    async function loginUser(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("loginPassword")
                .value;


        const button =
            document.getElementById(
                "loginButton"
            );


        if (!email) {

            showLoginMessage(
                "Please enter your email.",
                false
            );

            return;
        }


        if (!password) {

            showLoginMessage(
                "Please enter your password.",
                false
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Logging in...";


        console.log(
            "LOGIN URL:",
            API_BASE + "/login"
        );


        try {

            const response =
                await fetch(
                    API_BASE + "/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            console.log(
                "LOGIN STATUS:",
                response.status
            );


            const rawResponse =
                await response.text();


            console.log(
                "RAW LOGIN RESPONSE:",
                rawResponse
            );


            let data = null;


            try {

                data =
                    JSON.parse(
                        rawResponse
                    );

            } catch (error) {

                console.error(
                    "LOGIN JSON ERROR:",
                    error
                );

            }


            /* =========================================
               LOGIN FAILED
            ========================================== */

            if (!response.ok) {

                showLoginMessage(

                    data?.message ||
                    `Login failed (${response.status})`,

                    false

                );


                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            /* =========================================
               LOGIN SUCCESS
            ========================================== */

            console.log(
                "LOGIN SUCCESS:",
                data
            );


            /*
               SAVE TOKEN
            */

            if (data?.token) {

                localStorage.setItem(
                    "token",
                    data.token
                );

            }


            /*
               SAVE USER
            */

            if (data?.user) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(
                        data.user
                    )
                );

            }


            /*
               LOGIN FLAG
            */

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            showLoginMessage(
                data?.message ||
                "Login successful! Redirecting...",
                true
            );


            button.textContent =
                "Login Successful ✓";


            /*
               GO TO HOME
            */

            setTimeout(
                function () {

                    window.location.href =
                        "./index.html";

                },
                1000
            );


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            showLoginMessage(
                "Cannot connect to server. Please try again.",
                false
            );


            button.disabled = false;

            button.textContent =
                "Login";

        }

    }


    /* =====================================================
       LOGIN MESSAGE
    ===================================================== */

    function showLoginMessage(
        message,
        success
    ) {

        const messageBox =
            document.getElementById(
                "loginMessage"
            );


        messageBox.style.display =
            "block";


        messageBox.textContent =
            message;


        if (success) {

            messageBox.style.color =
                "#15803d";

            messageBox.style.background =
                "#dcfce7";

            messageBox.style.border =
                "1px solid #86efac";

        } else {

            messageBox.style.color =
                "#b91c1c";

            messageBox.style.background =
                "#fee2e2";

            messageBox.style.border =
                "1px solid #fecaca";

        }

    }

</script>

</body>

</html>
